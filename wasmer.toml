[package]
name = "aot_oladeji/academic-repository"
version = "0.1.0"
description = "Academic Publication Repository (Laravel API + React SPA, single app)"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "backend"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"
[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
