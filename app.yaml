kind: wasmer.io/App.v0
name: academic-repository
owner: aot_oladeji
package: .

env:
  APP_NAME: "Academic Publication Repository"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://academic-repository-aot_oladeji.wasmer.app
  FRONTEND_URL: https://academic-repository-aot_oladeji.wasmer.app
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  SESSION_DRIVER: array
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  BCRYPT_ROUNDS: "12"
  OPENALEX_MAILTO: you@university.edu

capabilities:
  database:
    engine: mysql

scaling:
  mode: single_concurrency
