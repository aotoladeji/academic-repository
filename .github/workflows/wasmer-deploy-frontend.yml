name: Deploy frontend to Wasmer

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/wasmer-deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Install Wasmer CLI
        run: curl https://get.wasmer.io -sSfL | sh

      - name: Deploy to Wasmer Edge
        working-directory: frontend
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          export PATH="$HOME/.wasmer/bin:$PATH"
          wasmer deploy --non-interactive
